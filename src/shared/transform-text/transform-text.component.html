<div class="container">
@for(part of textParts; track $index) {
    @if(typeof part === 'string') {
        {{getTextPartsText(part) | translate}}
    } @else if(getTextPartType(part)==="emoticon") {
        <img [src]="getEmoticonPicture(part)" class="emoticon" [hoverInfo]="getHoverInfo(part)">
    } @else if(getTextPartType(part)==="text") {
        <div class="text" [hoverInfo]="getHoverInfo(part)">{{getTextPartsText(part) | translate}}</div>
    }
}
</div>
