<div class="container">
@for(part of textParts; track $index) {
    @if(typeof part === 'string') {
        {{part}}
    } @else if(getTextPartType(part)==="emoticon") {
        <img [src]="getEmoticonPicture(part)" class="emoticon" (pointerenter)="enter($event, part)" (pointerleave)="leave()">
    } @else if(getTextPartType(part)==="text") {
        <div class="text"  (pointerenter)="enter($event, part)" (pointerleave)="leave()">{{getTextPartsText(part)}}</div>
    }
}
</div>
