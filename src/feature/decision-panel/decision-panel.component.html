<div>
    <button (click)="onGoBackClick()">Go back</button>
</div>
Choose one:
<div class="decisions">
@for(option of decisionOptions(); track $index) {
    <div class="tile"  (click)="onOptionChosen(option)" >
    @if(getCardInfo(option); as card) {
        <div>
            Receive card:
        </div>
        <app-card [card]="card"/>
    }
    @if(getResourcesTextPart(option); as resourcesTextPart) {
        <div>
            Receive resources:
        </div>
        <div>
            <div><app-transform-text [textParts]="resourcesTextPart"/></div>
        </div>
    }
    </div>
}
</div>
