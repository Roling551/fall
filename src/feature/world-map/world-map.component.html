@if(tiles()) {
    <app-isometric-tiling 
        [tilesData]="tiles()!"
        [getId]="getTilesId"
        [sizeX]="sizeX"
        [sizeY]="sizeY"
        [backgroundImage]="backgroundImage"
        (tileClick)="mapAction()($event)"
        [graphics]="tileInfo()"
        (tileHover)="onHoverChange($event)"
    />
}
