<div class="container">
    <div class="left" (click)="drawCard()">
        <div>Cards: {{drawSize()}}</div>
        <div>Draws: {{manualDrawsLeft()}}</div>
    </div>
    <div class="middle">
        <div class="hand">
            @for(card of hand(); track card.id) {
                <app-card [card]="card" [class.selected]="isCardSelected(card)" [class.override-selected]="isCardOverrideSelected(card)" (click)="onCardClick(card)"></app-card>
            }
        </div>
    </div>
    <div class="right" (click)="onDiscardClick()">{{discardSize()}}</div>
</div>
