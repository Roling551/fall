<div class="container">
    @for(group of groups(); track group.group) {
        {{group.group}}
        <div class="group">
        @for(card of group.cards; track card.id)  {
            <app-card [card]="card" [class.selected]="isCardSelected(card)" [class.override-selected]="isCardOverrideSelected(card)" (click)="onCardClick(card)"/>
        }
        </div>
    }
</div>
