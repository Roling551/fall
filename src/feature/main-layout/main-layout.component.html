<div class="container"  (contextmenu)="onRightClick($event)">
    <div class="header">
        <app-game-info-panel></app-game-info-panel>
    </div>
    <div>
        <ng-template #sideContainer></ng-template>
    </div>
    <div style="overflow: hidden;">
        <app-world-map/>
    </div>
    <div class="left-container">
        @if(actionsCards) {
            <app-cards-list [cardsHand]="actionsCards"></app-cards-list>
        }
    </div>
    <div class="footer">
        <app-cards [cardsHand]="charactersCards"></app-cards>
    </div>

    @if(getHover(); as hover) {
        <div
            class="overlay-window"
            [style.top.px]="hover.y"
            [style.left.px]="hover.x"
            [class.left]="hover.isLeft"
            [class.top]="hover.isTop"
        >
            <app-transform-text [textParts]="hover.textParts"/>
        </div>
    }
</div>
